<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarQ — Branding Solutions, Libya</title>
    <meta name="description" content="MarQ is a branding studio in Libya — turning ambitious ideas into identities people recognise, trust, and remember." />
    <link rel="icon" type="image/png" href="og-image.png" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MarQ — Branding Solutions" />
    <meta property="og:title" content="MarQ - Branding Solutions" />
    <meta property="og:description" content="A Libyan branding studio — turning ambitious ideas into identities people recognise, trust, and remember." />
    <meta property="og:url" content="https://sheedosa.github.io/marq-website/" />
    <meta property="og:image" content="https://sheedosa.github.io/marq-website/og-image.png" />
    <meta property="og:image:secure_url" content="https://sheedosa.github.io/marq-website/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="MarQ — Branding Solutions" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_LY" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MarQ - Branding Solutions" />
    <meta name="twitter:description" content="A Libyan branding studio — turning ambitious ideas into identities people recognise, trust, and remember." />
    <meta name="twitter:image" content="https://sheedosa.github.io/marq-website/og-image.png" />
    <meta name="twitter:image:alt" content="MarQ — Branding Solutions" />

    <!-- start fetching the hero background video immediately on page load -->
    <link rel="preload" as="video" href="hero.mp4" type="video/mp4" />

    <!-- SPA deep-link restore for GitHub Pages (pairs with public/404.html) -->
    <script type="text/javascript">
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
