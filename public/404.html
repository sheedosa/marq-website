<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MarQ</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages — MIT
      // Redirects a deep-link 404 to index.html, encoding the path so the app's
      // restore snippet (in index.html) can rebuild it for the router.
      var pathSegmentsToKeep = 1; // keep "/marq-website" base segment
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
